services:
  privoxy:
    image: vimagick/privoxy
    container_name: privoxy
    network_mode: "service:vpn"
    restart: always
    mem_limit: 128m
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    labels:
      - com.centurylinklabs.watchtower.depends-on=vpn
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8118"]
      interval: 30s
      retries: 5
      start_period: 10s
      timeout: 5s
    depends_on:
      vpn:
        condition: service_healthy
    profiles:
      - privoxy
