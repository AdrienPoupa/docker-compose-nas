name: Validate docker-compose

on:
  push:
  pull_request:

jobs:
  validate-docker-compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Environment Variables
        run: cp .env.example .env
      - name: Validate Docker Compose
        run: docker compose config --quiet
